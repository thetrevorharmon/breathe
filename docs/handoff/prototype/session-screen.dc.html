<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Breathing session demo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4BFFF}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: linear-gradient(180deg, {{c.bgTop}} 0%, {{c.bgBottom}} 100%); color: {{c.text}}; font-family: 'Manrope', system-ui, sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; align-items: center; padding: 56px 24px 44px">

  <div style="width: 100%; height: 44px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: center; gap: 4px">
      <sc-if value="{{hasExit}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{exit}}" aria-label="End workout" style="width: 44px; height: 44px; margin-left: -12px; border: none; background: transparent; color: {{c.text}}; font-family: 'Manrope', sans-serif; font-size: 30px; font-weight: 400; line-height: 1; cursor: pointer">×</button>
      </sc-if>
      <div style="font-size: 17px; font-weight: 700">Strength Protocol</div>
    </div>
    <div style="font-size: 14px; font-weight: 600; color: {{c.muted}}">{{elapsed}} <span style="color: {{c.faint}}">/ {{total}}</span></div>
  </div>

  <div style="position: relative; width: 330px; height: 330px; margin-top: 72px">

    <sc-for list="{{arcs}}" as="arc" hint-placeholder-count="3">
      <svg width="330" height="330" aria-hidden="true" style="position: absolute; left: 0; top: 0; transform: rotate(-90deg)">
        <circle cx="165" cy="165" r="160" fill="none" style="stroke: {{arc.track}}; stroke-width: 4px; stroke-linecap: round; stroke-dasharray: {{arc.trackDash}}; stroke-dashoffset: {{arc.off}}"></circle>
        <circle cx="165" cy="165" r="160" fill="none" style="stroke: {{arc.fill}}; stroke-width: 4px; stroke-linecap: round; stroke-dasharray: {{arc.fillDash}}; stroke-dashoffset: {{arc.off}}; opacity: {{arc.fillOpacity}}"></circle>
      </svg>
    </sc-for>

    <sc-for list="{{ticks}}" as="tk" hint-placeholder-count="27">
      <div style="position: absolute; left: 164px; top: 161px; width: 2px; height: 8px; border-radius: 1px; background: {{tk.color}}; transform: rotate({{tk.a}}deg) translateY(-150px)"></div>
    </sc-for>

    <div style="position: absolute; left: {{dotX}}px; top: {{dotY}}px; width: 16px; height: 16px; border-radius: 50%; background: {{c.progress}}; box-shadow: {{c.glow}}"></div>

    <div style="position: absolute; left: 40px; top: 40px; width: 250px; height: 250px; transform: scale({{scale}})">
      <svg width="250" height="250" aria-hidden="true" style="position: absolute; left: 0; top: 0; transform: rotate(-90deg)">
        <circle cx="125" cy="125" r="121" fill="none" style="stroke: {{innerTrack}}; stroke-width: 8px"></circle>
        <circle cx="125" cy="125" r="121" fill="none" style="stroke: {{innerColor}}; stroke-width: 8px; stroke-linecap: round; stroke-dasharray: {{innerDash}}; opacity: {{innerOpacity}}"></circle>
      </svg>
      <sc-if value="{{isBreathe}}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{phaseDots}}" as="pd" hint-placeholder-count="4">
          <div style="position: absolute; left: {{pd.x}}px; top: {{pd.y}}px; width: 10px; height: 10px; border-radius: 50%; background: {{pd.color}}"></div>
        </sc-for>
      </sc-if>
    </div>

    <div style="position: absolute; left: 0; top: 0; width: 330px; height: 330px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center">
      <sc-if value="{{isBreathe}}" hint-placeholder-val="{{ true }}">
        <div style="font-size: 30px; font-weight: 800; letter-spacing: 0.16em; padding-left: 0.16em; opacity: {{labelOpacity}}">{{label}}</div>
      </sc-if>
      <sc-if value="{{isCount}}" hint-placeholder-val="{{ false }}">
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: {{c.restText}}">{{countTitle}}</div>
        <div style="font-size: 56px; font-weight: 700; line-height: 1">{{countNum}}</div>
      </sc-if>
      <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
        <div style="font-size: 34px; font-weight: 800">Done</div>
        <div style="font-size: 14px; color: {{c.muted}}">{{doneSub}}</div>
      </sc-if>
    </div>
  </div>

  <div style="margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <div style="font-size: 18px; font-weight: 700">{{statusMain}}</div>
    <div style="font-size: 14px; color: {{c.muted}}">{{statusSub}}</div>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 28px; width: 100%">
    <sc-if value="{{showFinish}}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{finish}}" style="width: 100%; height: 60px; border-radius: 30px; border: none; background: {{c.btn}}; color: {{c.btnIcon}}; font-family: 'Manrope', sans-serif; font-size: 18px; font-weight: 800; cursor: pointer">Continue</button>
    </sc-if>
    <sc-if value="{{showControls}}" hint-placeholder-val="{{ true }}">
    <button type="button" onClick="{{restart}}" style="min-width: 80px; height: 44px; border: none; background: transparent; color: {{c.muted}}; font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Restart</button>
    <button type="button" onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width: 68px; height: 68px; border-radius: 50%; border: none; background: {{c.btn}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <sc-if value="{{running}}" hint-placeholder-val="{{ true }}">
        <span style="display: flex; gap: 6px"><span style="width: 6px; height: 22px; border-radius: 2px; background: {{c.btnIcon}}"></span><span style="width: 6px; height: 22px; border-radius: 2px; background: {{c.btnIcon}}"></span></span>
      </sc-if>
      <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
        <span style="width: 0; height: 0; margin-left: 5px; border-top: 12px solid transparent; border-bottom: 12px solid transparent; border-left: 19px solid {{c.btnIcon}}"></span>
      </sc-if>
    </button>
    <button type="button" onClick="{{skip}}" disabled="{{skipDisabled}}" style="min-width: 80px; height: 44px; border: none; background: transparent; color: {{c.restText}}; font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; opacity: {{skipOpacity}}">Skip</button>
    </sc-if>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["Current","Volt","Heat","Graphite"],"default":"Current","section":"Look"},"mode":{"editor":"enum","options":["Dark","Light"],"default":"Dark","section":"Look"},"speed":{"editor":"enum","options":["1×","2×","4×","8×"],"default":"1×","section":"Demo"},"ringBreathes":{"editor":"boolean","default":true,"section":"Demo"},"sets":{"editor":"int","default":3,"min":1,"max":6,"section":"Session"},"reps":{"editor":"int","default":10,"min":1,"max":30,"section":"Session"},"restSeconds":{"editor":"int","default":60,"min":5,"max":180,"unit":"s","section":"Session"},"inhale":{"editor":"float","default":2.5,"min":0.5,"max":10,"step":0.5,"unit":"s","section":"Session"},"holdTop":{"editor":"float","default":1,"min":0,"max":10,"step":0.5,"unit":"s","section":"Session"},"exhale":{"editor":"float","default":2.5,"min":0.5,"max":10,"step":0.5,"unit":"s","section":"Session"},"holdBottom":{"editor":"float","default":1,"min":0,"max":10,"step":0.5,"unit":"s","section":"Session"},"onFinish":{"editor":null},"onExit":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  palettes() {
    return {
  Current: {
    Dark:  { bgTop: '#0B2036', bgBottom: '#050C18', text: '#FFFFFF', muted: '#9AA6C2', faint: '#5F6B86', breath: '#D4BFFF', rest: '#6EE7C8', restText: '#6EE7C8', progress: '#F39146', btn: '#D4BFFF', btnIcon: '#0B1A2E' },
    Light: { bgTop: '#F4F2FB', bgBottom: '#E7E3F4', text: '#141027', muted: '#5C5875', faint: '#7E7A96', breath: '#6D4FE0', rest: '#0E9C7C', restText: '#0B7F65', progress: '#E0701F', btn: '#6D4FE0', btnIcon: '#FFFFFF' }
  },
  Volt: {
    Dark:  { bgTop: '#17191C', bgBottom: '#070708', text: '#FFFFFF', muted: '#9BA1AA', faint: '#5C626B', breath: '#D2FF1F', rest: '#2EC8FF', restText: '#2EC8FF', progress: '#FFFFFF', btn: '#D2FF1F', btnIcon: '#0A0A0A' },
    Light: { bgTop: '#F5F6F2', bgBottom: '#E6E9E2', text: '#0E0F11', muted: '#565B62', faint: '#7A7F86', breath: '#5E9C00', rest: '#0088BD', restText: '#00759F', progress: '#0E0F11', btn: '#0E0F11', btnIcon: '#D2FF1F' }
  },
  Heat: {
    Dark:  { bgTop: '#200E0B', bgBottom: '#0A0505', text: '#FFF6F2', muted: '#B39B94', faint: '#6E5A55', breath: '#FF5533', rest: '#6B97FF', restText: '#6B97FF', progress: '#FFB627', btn: '#FF5533', btnIcon: '#1E0E0C' },
    Light: { bgTop: '#FCF6F3', bgBottom: '#F3E7E1', text: '#1E0E0C', muted: '#6A5651', faint: '#8C7771', breath: '#E8401C', rest: '#3567E8', restText: '#2A55CC', progress: '#B86E00', btn: '#E8401C', btnIcon: '#FFFFFF' }
  },
  Graphite: {
    Dark:  { bgTop: '#161A21', bgBottom: '#090B0E', text: '#F5F7FA', muted: '#98A2B3', faint: '#5B6472', breath: '#19E3B1', rest: '#A78BFA', restText: '#B49CFB', progress: '#FF6A1A', btn: '#19E3B1', btnIcon: '#0B0E12' },
    Light: { bgTop: '#F6F8FA', bgBottom: '#E8ECF1', text: '#0B0E12', muted: '#566070', faint: '#7A8494', breath: '#00A07D', rest: '#7552EE', restText: '#6440E0', progress: '#EA580C', btn: '#0B0E12', btnIcon: '#F6F8FA' }
  }
};
  }
  rgbOf(hex) {
    var h = hex.replace('#', '');
    return parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16);
  }
  componentDidMount() {
    var self = this;
    this._last = null;
    var tick = function (now) {
      if (self._last === null) self._last = now;
      var dt = Math.min(Math.max((now - self._last) / 1000, 0), 0.1);
      self._last = now;
      var st = self.state || {};
      if (!st.paused) {
        var sp = parseFloat(self.props.speed || '1') || 1;
        var nt = (st.t || 0) + dt * sp;
        if (self._total && nt > self._total) nt = self._total;
        if (nt !== st.t) self.setState({ t: nt });
      }
      self._raf = requestAnimationFrame(tick);
    };
    this._raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() {
    if (this._raf) cancelAnimationFrame(this._raf);
  }
  renderVals() {
    var P = this.props || {};
    var st = this.state || {};
    var PALETTES = this.palettes();
    var rgbOf = this.rgbOf;
    var fam = PALETTES[P.palette] || PALETTES.Current;
    var base = fam[P.mode === 'Light' ? 'Light' : 'Dark'];
    var isLight = P.mode === 'Light';
    var textRGB = rgbOf(base.text), breathRGB = rgbOf(base.breath), restRGB = rgbOf(base.rest), progRGB = rgbOf(base.progress);
    var c = {
      bgTop: base.bgTop, bgBottom: base.bgBottom, text: base.text, muted: base.muted, faint: base.faint,
      breath: base.breath, rest: base.rest, restText: base.restText, progress: base.progress, btn: base.btn, btnIcon: base.btnIcon,
      glow: '0 0 0 5px rgba(' + progRGB + ',' + (isLight ? '0.14' : '0.22') + '), 0 0 18px rgba(' + progRGB + ',' + (isLight ? '0.25' : '0.55') + ')'
    };
    var trackOuter = 'rgba(' + textRGB + ',' + (isLight ? '0.12' : '0.14') + ')';
    var tickOff = 'rgba(' + textRGB + ',' + (isLight ? '0.22' : '0.22') + ')';
    var tickOn = 'rgba(' + progRGB + ',0.9)';

    var num = function (v, d) { var n = parseFloat(v); return isFinite(n) ? n : d; };
    var inh = Math.max(0.5, num(P.inhale, 2.5));
    var h1 = Math.max(0, num(P.holdTop, 1));
    var exh = Math.max(0.5, num(P.exhale, 2.5));
    var h2 = Math.max(0, num(P.holdBottom, 1));
    var sets = Math.max(1, Math.round(num(P.sets, 3)));
    var reps = Math.max(1, Math.round(num(P.reps, 10)));
    var rest = Math.max(1, num(P.restSeconds, 60));
    var breathes = P.ringBreathes !== false;
    var C = inh + h1 + exh + h2;
    var LEAD = 3;

    var segs = [{ kind: 'lead', dur: LEAD, set: 0 }];
    for (var k = 0; k < sets; k++) {
      segs.push({ kind: 'breathe', dur: reps * C, set: k });
      if (k < sets - 1) segs.push({ kind: 'rest', dur: rest, set: k + 1 });
    }
    var total = 0;
    segs.forEach(function (s) { total += s.dur; });
    this._total = total;

    var t = Math.min(st.t || 0, total);
    var seg = null, el = 0, acc = 0;
    for (var i = 0; i < segs.length; i++) {
      if (t < acc + segs[i].dur) { seg = segs[i]; el = t - acc; break; }
      acc += segs[i].dur;
    }
    var segEnd = seg ? acc + seg.dur : total;
    var isDone = !seg;
    var isBreathe = !!seg && seg.kind === 'breathe';
    var isCount = !!seg && (seg.kind === 'lead' || seg.kind === 'rest');
    var f = seg ? el / seg.dur : 1;

    // Outer session ring
    var A = 360 / sets, g = 10;
    var a;
    if (isDone) a = sets * A - g / 2;
    else if (seg.kind === 'breathe') a = seg.set * A + g / 2 + f * (A - g);
    else a = seg.set * A - g / 2 + f * g;
    var Ro = 160, Lo = 2 * Math.PI * Ro;
    var arcs = [];
    var ticks = [];
    for (var j = 0; j < sets; j++) {
      var start = j * A + g / 2, len = A - g;
      var fill = Math.min(Math.max(a - start, 0), len);
      arcs.push({
        track: trackOuter,
        fill: base.progress,
        trackDash: (len / 360 * Lo).toFixed(2) + ' ' + Lo.toFixed(2),
        fillDash: (fill / 360 * Lo).toFixed(2) + ' ' + Lo.toFixed(2),
        off: (-start / 360 * Lo).toFixed(2),
        fillOpacity: fill > 0.3 ? 1 : 0
      });
      for (var r = 1; r < reps; r++) {
        var ta = start + r / reps * len;
        ticks.push({ a: ta.toFixed(2), color: a >= ta ? tickOn : tickOff });
      }
    }
    var arad = a * Math.PI / 180;
    var dotX = 165 + 160 * Math.sin(arad) - 8;
    var dotY = 165 - 160 * Math.cos(arad) - 8;

    // Inner breathing ring
    var Ri = 121, Li = 2 * Math.PI * Ri;
    var label = '', labelOpacity = 1, level = 0, sweep = 0, repIdx = 0;
    if (isBreathe) {
      repIdx = Math.min(reps - 1, Math.floor(el / C));
      var p = el - repIdx * C;
      var ps, plen;
      if (p < inh) { level = p / inh; label = 'INHALE'; ps = 0; plen = inh; }
      else if (p < inh + h1) { level = 1; label = 'HOLD'; ps = inh; plen = h1; }
      else if (p < inh + h1 + exh) { level = 1 - (p - inh - h1) / exh; label = 'EXHALE'; ps = inh + h1; plen = exh; }
      else { level = 0; label = 'HOLD'; ps = inh + h1 + exh; plen = h2; }
      labelOpacity = Math.min(1, (p - ps) / 0.2).toFixed(2);
      sweep = p / C * 360;
    }
    var innerLen = 0;
    if (isBreathe) innerLen = sweep / 360 * Li;
    else if (isCount) innerLen = f * Li;
    else innerLen = Li;
    var scale = breathes ? (isDone ? 1 : (isBreathe ? 0.8 + 0.2 * level : 0.8)) : 1;

    var bounds = [0, inh, inh + h1, inh + h1 + exh];
    var phaseDots = bounds.map(function (b) {
      var ang = b / C * 360;
      var rad = ang * Math.PI / 180;
      var lit = ang === 0 || sweep >= ang;
      return {
        x: (125 + Ri * Math.sin(rad) - 5).toFixed(1),
        y: (125 - Ri * Math.cos(rad) - 5).toFixed(1),
        color: lit ? base.text : 'rgba(' + breathRGB + ',0.45)'
      };
    });

    var countNum = seg ? Math.max(1, Math.ceil(seg.dur - el - 1e-6)) : 0;
    var countTitle = '', statusMain = '', statusSub = '';
    if (isCount && seg.kind === 'lead') {
      countTitle = 'GET READY';
      statusMain = 'Set 1 of ' + sets; statusSub = 'Up next';
    } else if (isCount) {
      countTitle = 'REST';
      statusMain = 'Set ' + (seg.set + 1) + ' of ' + sets; statusSub = 'Up next';
    } else if (isBreathe) {
      statusMain = 'Set ' + (seg.set + 1) + ' of ' + sets;
      statusSub = 'Rep ' + (repIdx + 1) + ' of ' + reps;
    } else {
      statusMain = 'Set ' + sets + ' of ' + sets; statusSub = 'Complete';
    }

    var fmt = function (s) { s = Math.floor(s); var m = Math.floor(s / 60); var r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; };
    var self = this;
    var paused = !!st.paused;
    return {
      c: c,
      elapsed: fmt(t),
      total: fmt(total),
      arcs: arcs,
      ticks: ticks,
      dotX: dotX.toFixed(1),
      dotY: dotY.toFixed(1),
      scale: scale.toFixed(4),
      innerDash: innerLen.toFixed(2) + ' ' + Li.toFixed(2),
      innerOpacity: innerLen > 0.5 ? 1 : 0,
      innerColor: isCount ? base.rest : base.breath,
      innerTrack: isCount ? 'rgba(' + restRGB + ',0.16)' : 'rgba(' + breathRGB + ',0.16)',
      phaseDots: phaseDots,
      isBreathe: isBreathe,
      isCount: isCount,
      isDone: isDone,
      label: label,
      labelOpacity: labelOpacity,
      countTitle: countTitle,
      countNum: countNum,
      doneSub: sets + ' sets · ' + (sets * reps) + ' reps',
      statusMain: statusMain,
      statusSub: statusSub,
      running: !paused,
      paused: paused,
      toggleLabel: paused ? 'Resume' : 'Pause',
      toggle: function () { self.setState({ paused: !paused }); },
      restart: function () { self._last = null; self.setState({ t: 0, paused: false }); },
      skip: function () { if (isCount) self.setState({ t: segEnd }); },
      skipDisabled: !isCount,
      skipOpacity: isCount ? 1 : 0,
      hasExit: typeof P.onExit === 'function',
      exit: function () { if (typeof self.props.onExit === 'function') self.props.onExit(); },
      showFinish: isDone && typeof P.onFinish === 'function',
      showControls: !(isDone && typeof P.onFinish === 'function'),
      finish: function () { if (typeof self.props.onFinish === 'function') self.props.onFinish(); }
    };
  }
}
</script>
</body>
</html>
